<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/agendar.css">
    <link rel="shortcut icon" href="../img/cabecalho/Logo-icon.png" type="image/x-icon">
    <title>Dra.Maristela Armiliato</title>
</head>

<body>
    <section class="agendar">

        <div class="img">
            <img src="../img/agendar/Dra. Maristela SemFundo..png" alt="Dra. Maristela" class="draimg"
                onerror="this.onerror=null;this.src='https:/placehold.co/300x400/f22987/ffffff?text=Dra+Maristela'">

            <div class="horario">
                <div class="phorario">
                    <p>Segunda à Sexta</p>
                </div>
                <span>08:30 às 18:30</span>
                <div class="phorario">
                    <p>Sábado</p>
                </div>
                <span>09:00 às 15:00</span>
            </div>
        </div>
        <form class="formulario" id="agendamentoForm">
            <div class="titulo">
                <h2>Agende sua consulta</h2>
            </div>
            <div class="preenchimento">
                <label for="nometutor">Nome do Tutor</label>
                <input type="text" id="nometutor" name="Nome do Tutor" required>

                <label for="nomepet">Nome do Pet</label>
                <input type="text" id="nomepet" name="nomepet" required>

                <label for="telefone">Telefone para contato</label>
                <input type="tel" id="telefone" name="telefone" required>

                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" required>

                <label for="data">Data desejada da consulta</label>
                <input type="date" id="data" name="data" required>

                <label for="hora">Horario desejado da consulta</label>
                <input type="time" id="hora" name="hora" required>

                <button type="submit">Enviar Agendamento</button>
            </div>
        </form>
        <div id="depois" class="depois">
            <div class="mensagem">
                <h3>Sucesso!</h3>
                <p>Seu agendamento foi enviado com sucesso. Aguarde nosso contato para confirmação.</p>
                <a href="../index.html">
                    <button id="fechar" type="button">Fechar</button>
                </a>
            </div>
        </div>

    </section>

    <script src="../js/agendar.js"></script>
</body>


</html>
